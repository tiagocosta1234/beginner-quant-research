name: tests

on:
  push:
  pull_request:

jobs:
  live-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r futures/live_bot/requirements.txt
      - name: Run the live bot test files
        working-directory: futures
        run: python live_bot/tests/run_all.py

  drift-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas matplotlib pytest
      - name: Run the drift book tests (made-up prices, no network)
        run: python -m pytest drift_book -q
