name: live bot tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r futures/live_bot/requirements.txt
      - name: Run the live bot test files
        working-directory: futures
        run: python live_bot/tests/run_all.py
